name: SOVT Translation Bot

on:
  workflow_dispatch:
    inputs:
      text:
        description: "النص المراد ترجمته"
        required: true
        default: "Hello"
      source:
        description: "لغة المصدر"
        required: true
        default: "en"
      target:
        description: "لغة الهدف"
        required: true
        default: "ar"

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المتطلبات
        run: pip install -r requirements.txt

      - name: تثبيت Chromium
        run: python -m playwright install --with-deps chromium

      - name: تشغيل البوت
        run: python bot.py
        env:
          TEXT: ${{ inputs.text }}
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
